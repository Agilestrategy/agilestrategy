<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="600" height="600"><g id="logoMark">
      <!-- retro water-ski badge, Cypress Gardens era -->
      <circle cx="60" cy="60" r="57" fill="#f6efd9"/>
      <circle cx="60" cy="60" r="55.5" fill="none" stroke="#0f3b46" stroke-width="5"/>
      <circle cx="60" cy="60" r="47.5" fill="none" stroke="#EDC52C" stroke-width="0.9"/>
      <!-- sunburst: slim defined rays, tucked just under the lettering -->
      <g stroke="#EDC52C" stroke-width="1.8" stroke-linecap="round">
        <path d="M60 23.5V18.5"/>
        <path d="M65.3 24.7l2.3-5M54.7 24.7l-2.3-5"/>
        <path d="M69.6 28l4.2-3.6M50.4 28l-4.2-3.6"/>
        <path d="M72.1 32.8l5.3-1.5M47.9 32.8l-5.3-1.5"/>
      </g>
      <circle cx="60" cy="36" r="9" fill="#EDC52C">
        <animate attributeName="r" values="9;9.8;9" dur="3s" repeatCount="indefinite"/>
      </circle>
      <!-- crossed water skis (25% smaller) -->
      <g>
        <rect x="28" y="60" width="64" height="6" rx="3" fill="#b1472b" transform="rotate(22 60 63)"/>
        <rect x="28" y="60" width="64" height="6" rx="3" fill="#0f3b46" transform="rotate(-22 60 63)"/>
        <line x1="32" y1="63" x2="88" y2="63" stroke="#f6efd9" stroke-width="0.7" transform="rotate(22 60 63)"/>
        <line x1="32" y1="63" x2="88" y2="63" stroke="#f6efd9" stroke-width="0.7" transform="rotate(-22 60 63)"/>
      </g>
      <!-- lightning: centred, dark-blue outline, striking toward the Est -->
      <path d="M60 47.5 L51.1 61.5 h6 L54.5 74 L68 56.5 h-6.4 L66.8 47.5 Z" fill="#EDC52C" stroke="#0f3b46" stroke-width="1" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate"
          values="0 0;0 3;0 0;0 1.6;0 0;0 0" keyTimes="0;.06;.12;.18;.24;1" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <text x="60" y="85.5" text-anchor="middle" font-family="'Segoe Script','Brush Script MT','Segoe UI',cursive" font-style="italic" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#b1472b">Est &#183; 1932</text>
      <!-- wave -->
      <path d="M30 92c7-5 15-5 22 0s15 5 22 0 11-4 16-2" fill="none" stroke="#3d95ad" stroke-width="2.4" stroke-linecap="round">
        <animate attributeName="d"
          values="M30 92c7-5 15-5 22 0s15 5 22 0 11-4 16-2;M30 92c7 5 15 5 22 0s15-5 22 0 11 4 16 2;M30 92c7-5 15-5 22 0s15 5 22 0 11-4 16-2"
          dur="4s" repeatCount="indefinite"/>
      </path>
      <!-- arc lettering, concentric with badge -->
      <defs>
        <path id="arcTop" d="M24.8,84.7 A43,43 0 1 1 95.2,84.7" fill="none"/>
      </defs>
      <text font-family="'Segoe Script','Brush Script MT','Segoe UI',cursive" font-size="12.3" font-weight="700" font-style="italic" letter-spacing="1" fill="#0f3b46">
        <textPath href="#arcTop" startOffset="50%" text-anchor="middle">Lake Uddstrom</textPath>
      </text>
    </g>
  </svg>