<style>
:root{--y:#FFD400;--k:#000;--w:#fff;--g1:#141414;--g2:#262626;--g3:#8a8a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--k);color:var(--w);font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;letter-spacing:-.01em}
button,input,select{font:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--k);border-bottom:3px solid var(--y);display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.top img{width:46px;height:46px}
.top .t1{color:var(--y);font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.06em}
.top .t2{font-size:12px;color:#ddd}
.live-dot{margin-left:auto;font-size:11px;color:var(--g3);text-align:right}
main{max-width:640px;margin:0 auto;padding:16px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--y);margin:22px 0 8px}
.card{background:var(--g1);border:1px solid var(--g2);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{background:var(--y);color:var(--k);border-radius:16px;padding:18px;margin-bottom:8px;position:relative;overflow:hidden}
.hero .lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.hero .vs{font-size:24px;font-weight:900;margin:4px 0 2px;line-height:1.1}
.hero .meta{font-size:14px;font-weight:600}
.count{display:flex;gap:8px;margin-top:12px}
.count div{background:var(--k);color:var(--y);border-radius:10px;padding:8px 0;flex:1;text-align:center;font-weight:900;font-size:22px}
.count span{display:block;font-size:9px;letter-spacing:.12em;color:var(--w);font-weight:700}
.game .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.game .when{font-size:13px;color:#ddd;font-weight:600}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:99px;padding:3px 9px;border:1px solid var(--w)}
.chip.live{background:var(--y);color:var(--k);border-color:var(--y);animation:pulse 1.4s infinite}
.chip.ft{background:var(--w);color:var(--k)}
.chip.kitW{background:var(--w);color:var(--k)} .chip.kitB{background:var(--k);color:var(--w)}
@keyframes pulse{50%{opacity:.55}}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:12px 0 6px}
.score .tm{font-weight:800;font-size:15px;line-height:1.15}.score .tm.r{text-align:right}
.score .tm.us{color:var(--y)}
.score .n{font-size:30px;font-weight:900;background:var(--k);border:1px solid var(--g2);border-radius:10px;padding:4px 14px;min-width:92px;text-align:center}
.sub{font-size:12px;color:var(--g3)}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px;font-weight:800;background:var(--y);color:var(--k);cursor:pointer;font-size:15px}
.btn:active{transform:translateY(1px)} .btn.ghost{background:transparent;color:var(--w);border:1px solid var(--w)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;display:inline-block}
.btn[disabled]{opacity:.4}
.pl{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--g2)}
.pl:last-child{border-bottom:0}
.no{width:42px;height:42px;border-radius:50%;background:var(--y);color:var(--k);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;flex:none}
.no.tbc{background:transparent;border:1px dashed var(--g3);color:var(--g3);font-size:10px}
.pl .nm{font-weight:700}.pl .ps{font-size:12px;color:var(--g3)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{background:var(--g1);border:1px solid var(--g2);color:var(--w);border-radius:10px;padding:10px;text-align:left;font-weight:700;cursor:pointer}
.pick button.on{background:var(--y);color:var(--k);border-color:var(--y)}
.pick button small{display:block;font-weight:600;opacity:.7}
.bar{height:10px;background:var(--g2);border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--y)}
.win{text-align:center;padding:8px 0 14px}.win .big{font-size:26px;font-weight:900;color:var(--y)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--k);border-top:1px solid var(--g2);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--g3);padding:10px 0 9px;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
nav button b{display:block;font-size:19px;line-height:1.2}
nav button.on{color:var(--y)}
input,select{width:100%;background:var(--k);color:var(--w);border:1px solid #555;border-radius:8px;padding:11px;font-size:16px}
input:focus,select:focus{outline:0;border-color:var(--y);box-shadow:0 0 0 3px rgba(255,212,0,.25)}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#ccc;margin:10px 0 4px}
.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.gate img{width:150px;height:150px}.gate h1{color:var(--y);font-size:26px;font-weight:900;text-transform:uppercase;margin-top:12px}
.gate form{width:100%;max-width:320px;margin-top:22px}
.gate input{text-align:center;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
.err{color:var(--y);font-size:13px;min-height:18px;margin-top:8px}
.step{display:flex;align-items:center;gap:8px}.step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--w);background:none;color:var(--w);font-size:22px;font-weight:800}
.step .v{font-size:26px;font-weight:900;width:38px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
ul.info{margin:0;padding-left:18px;line-height:1.55;font-size:14px}
a{color:var(--y)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--w);color:var(--k);font-weight:800;padding:10px 16px;border-radius:99px;font-size:13px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:8;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
#print{display:none}
@media print{html,body{background:#fff;color:#000;padding:0}#app,.toast,.cf{display:none!important}#print{display:block;padding:8mm;font-size:10pt;color:#000}
#print .ph{display:flex;gap:12px;align-items:center;border-bottom:4px solid #FFD400;padding-bottom:8px;margin-bottom:6px}#print .ph img{width:64px;height:64px}
#print h2{font-size:12pt;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em}#print table{width:100%;border-collapse:collapse}
#print th{background:#000;color:#FFD400;text-align:left;padding:5px;font-size:8.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}#print td{border-bottom:1px solid #bbb;padding:5px;font-size:9pt}}
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>
<div id="print"></div>

async function rpc(fn,args){
  const r=await fetch(CFG.url+"/rest/v1/rpc/esafc_"+fn,{method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify(args)});
  if(!r.ok) throw new Error("Network problem");
  return r.json();
}

const NZ="Pacific/Auckland";

const fmtTime=d=>new Intl.DateTimeFormat("en-NZ",{timeZone:NZ,hour:"numeric",minute:"2-digit",hour12:true}).format(new Date(d)).replace(/\s/g," ");

const P=id=>S.data.players.find(p=>p.id===id);
async function load(silent){
  if(!S.code) return render();
  try{
    const d=await rpc("app_state",{p_code:S.code,p_device:DEV});
    if(!d.ok){S.err="That code did not work. Check the team chat.";S.code="";store.del("esafc-code");S.data=null;}
    else{const prev=S.data;S.data=d;S.err="";store.set("esafc-code",S.code);S.updated=new Date();
      if(prev){d.games.forEach(g=>{const o=prev.games.find(x=>x.id===g.id);if(o&&!o.revealed&&g.revealed)confetti();});if(!prev.overall_revealed&&d.overall_revealed)confetti();}}
  }catch(e){if(!silent)S.err="Could not connect. Check your signal and try again.";}
  if(!silent||!(S.tab==="mgr"&&S.pin)) render();
}

function scoreLine(g){
  const us=`<div class="tm us ${g.first?"":"r"}">Eastern Suburbs</div>`,them=`<div class="tm ${g.first?"r":""}">${esc(g.opponent)}</div>`;
  const a=g.first?g.our:g.opp,b=g.first?g.opp:g.our;

function statusChip(g){return g.status==="live"?`<span class="chip live">Live</span>`:g.status==="full_time"?`<span class="chip ft">Full time</span>`:`<span class="chip">${esc(g.stage||"Upcoming")}</span>`;}

function vGames(){

function tallyHtml(t){
  if(!t||!t.length) return `<div class="sub">No votes were cast.</div>`;
  const max=t[0].n,total=t.reduce((a,x)=>a+x.n,0),w=t.filter(x=>x.n===max);
  return `<div class="win"><div class="sub">${w.length>1?"Joint MVPs":"MVP"}</div><div class="big">${w.map(x=>esc(pname(P(x.player)))).join(" &amp; ")}</div><div class="sub">${max} of ${total} votes</div></div>`+
   t.map(x=>`<div style="margin-bottom:8px"><div class="row" style="display:flex;justify-content:space-between;font-size:14px;font-weight:700"><span>${esc(pname(P(x.player)))}</span><span>${x.n}</span></div><div class="bar"><i style="width:${Math.round(x.n/max*100)}%"></i></div></div>`).join("");
}

    h+=`</div>`;
  });

}

function exportData(){
  const d=S.data,res=g=>g.status==="upcoming"?"":(g.our>g.opp?"Win":g.our<g.opp?"Loss":"Draw");
  const st={upcoming:"Upcoming",live:"Live",full_time:"Full time"};
  const games=[["Match","Stage","Date","Time","Field","Opponent","Kit","Status","ESAFC","Opponent score","Result"]].concat(d.games.map(g=>[g.code,g.stage,fmtDay(g.kickoff),fmtTime(g.kickoff),g.field,g.opponent,g.kit,st[g.status],g.status==="upcoming"?"":g.our??0,g.status==="upcoming"?"":g.opp??0,res(g)]));
  const squad=[["Shirt no.","First name","Surname","Positions"]].concat(d.players.map(p=>[p.no??"",p.first,p.last,p.pos]));
  const mvp=[["Game","Player","Votes"]];
  d.games.filter(g=>g.revealed).forEach(g=>(g.tally||[]).forEach(t=>mvp.push(["v "+g.opponent,pname(P(t.player)),t.n])));
  if(d.overall_revealed)(d.overall||[]).forEach(t=>mvp.push(["Tournament",pname(P(t.player)),t.n]));
  return {games,squad,mvp};
}
function csvText(){
  const x=exportData(),q=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const sec=(t,r)=>[t].concat(r.map(a=>a.map(q).join(","))).join("\r\n");
  return "\ufeff"+["ESAFC U17 | Western Springs Tournament | exported "+fmtDay(new Date())+" "+fmtTime(new Date()),"",sec("GAMES",x.games),"",sec("SQUAD",x.squad),"",sec("MVP VOTES (revealed only)",x.mvp.length>1?x.mvp:[["Nothing revealed yet"]])].join("\r\n");
}
function csvFile(){return new File([csvText()],"ESAFC-U17-Western-Springs.csv",{type:"text/csv"});}
function dlCsv(){const a=document.createElement("a");a.href=URL.createObjectURL(csvFile());a.download="ESAFC-U17-Western-Springs.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("Spreadsheet downloaded");}

}
async function pinIn(e){e.preventDefault();const v=$("#pin").value.trim();try{if(await rpc("mgr_check",{p_pin:v})){S.pin=v;S.merr="";}else S.merr="Wrong PIN.";}catch(x){S.merr="Could not connect.";}render();}
function bump(id,k,d){S.edit[id][k]=Math.max(0,S.edit[id][k]+d);render();}
async function mgr(fn,args,msg){try{const ok=await rpc(fn,Object.assign({p_pin:S.pin},args));if(ok){toast(msg);S.edit={};await load();}else{toast("PIN rejected");S.pin="";render();}}catch(e){toast("Could not save. Try again.");}}
function saveScore(id){const e=S.edit[id];mgr("mgr_set_score",{p_game:id,p_our:e.our,p_opp:e.opp,p_status:e.status},"Score saved");}
function reveal(id,on){mgr("mgr_reveal",{p_game:id,p_on:on},on?"Revealed":"Hidden");}
function gArgs(g,o){return Object.assign({p_id:g.id,p_code:g.code,p_stage:g.stage,p_kickoff:g.kickoff,p_field:g.field,p_opponent:g.opponent,p_first:g.first,p_kit:g.kit},o);}
function kit(id){const g=S.data.games.find(x=>x.id===id);mgr("mgr_save_game",gArgs(g,{p_kit:/black/i.test(g.kit)?"White":"Black"}),"Kit updated");}
function delGame(id){if(S.confirmDel!==id){S.confirmDel=id;toast("Tap Remove again to confirm");return;}S.confirmDel=null;mgr("mgr_delete_game",{p_id:id},"Game removed");}
function addGame(e){e.preventDefault();const w=$("#g-when").value;if(!w)return;mgr("mgr_save_game",{p_id:null,p_code:$("#g-code").value.trim(),p_stage:$("#g-stage").value.trim(),p_kickoff:w+":00+13:00",p_field:$("#g-field").value.trim(),p_opponent:$("#g-opp").value.trim(),p_first:$("#g-first").value==="1",p_kit:$("#g-kit").value},"Game added");}
function setNo(id,v){const p=P(id),n=v.trim()===""?null:parseInt(v,10);if(n!==null&&(isNaN(n)||n<1||n>99)){toast("Use a number from 1 to 99");return;}
  if(n!==null&&S.data.players.some(x=>x.id!==id&&x.no===n)){toast("Number "+n+" is already taken");render();return;}
  mgr("mgr_save_player",{p_id:id,p_first:p.first,p_last:p.last,p_no:n,p_pos:p.pos,p_active:true},"Number saved");}
function openVote(id){S.voteGame=id;S.tab="mvp";render();window.scrollTo(0,0);}
async function vote(g,p){try{const r=await rpc("cast_vote",{p_code:S.code,p_device:DEV,p_game:g,p_player:p});toast(r.ok?"Vote locked in":(r.msg||"Could not vote"));await load();}catch(e){toast("Could not connect");}}
function go(t){S.tab=t;S.voteGame=null;render();window.scrollTo(0,0);}
function tick(){const c=$("#count");if(!c)return;let s=Math.max(0,Math.floor((new Date(c.dataset.t)-Date.now())/1000));const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;
  c.innerHTML=[[d,"DAYS"],[h,"HOURS"],[m,"MINS"],[s,"SECS"]].map(x=>`<div>${String(x[0]).padStart(2,"0")}<span>${x[1]}</span></div>`).join("");}
function render(){
  const a=$("#app");
  if(!S.data){a.innerHTML=gate();return;}
  const views={games:vGames,squad:vSquad,mvp:vMvp,info:vInfo,how:vHow,mgr:vMgr};
  const tabs=[["games","Games","&#9917;"],["squad","Squad","&#128085;"],["mvp","MVP","&#11088;"],["info","Info","&#8505;"],["how","How to","&#10067;"],["mgr","Manager","&#128274;"]];
  a.innerHTML=header()+`<main>${views[S.tab]()}</main><nav>${tabs.map(t=>`<button class="${S.tab===t[0]?"on":""}" onclick="go('${t[0]}')"><b>${t[2]}</b>${t[1]}</button>`).join("")}</nav>`;
  tick();
}
setInterval(tick,1000);
setInterval(()=>{if(S.data&&!document.hidden)load(true);},20000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.data)load(true);});
if(S.code) load(); else render();
</script>
</body>
</html>
